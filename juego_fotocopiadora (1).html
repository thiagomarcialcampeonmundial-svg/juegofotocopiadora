<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Juego de Fotocopiadora</title>
<style>
*{box-sizing:border-box}
body{font-family:Arial,sans-serif;margin:0;background:#f4f6f8;color:#17202a}
.container{max-width:760px;margin:30px auto;padding:20px}
.card{background:white;border-radius:18px;padding:25px;box-shadow:0 4px 18px rgba(0,0,0,.08)}
.header{display:flex;justify-content:space-between;gap:15px;flex-wrap:wrap}
.badge{background:#eef2ff;padding:8px 12px;border-radius:20px;font-weight:bold}
h1{margin:0 0 6px;font-size:26px}
h2{font-size:20px}
.question{background:#f7f8fa;border-radius:14px;padding:18px;margin-top:20px}
.option{display:block;width:100%;text-align:left;padding:15px;margin:10px 0;border:2px solid #ddd;border-radius:12px;background:white;font-size:16px;cursor:pointer}
.option:hover{border-color:#2563eb}
.option:disabled{cursor:default}
.correct{border-color:#16a34a!important;background:#dcfce7!important}
.wrong{border-color:#dc2626!important;background:#fee2e2!important}
button.next,.restart{border:0;border-radius:12px;padding:13px 20px;background:#2563eb;color:white;font-weight:bold;cursor:pointer}
button:disabled{opacity:.5;cursor:not-allowed}
.footer{display:flex;justify-content:flex-end;margin-top:20px}
.feedback{min-height:25px;font-weight:bold;margin-top:12px}
.result{text-align:center}
</style>
</head>
<body>
<div class="container">
<div class="card" id="game">
<div class="header">
<div><h1>Juego de Fotocopiadora</h1><div id="topic">Pedido pequeño de fotocopias</div></div>
<div class="badge" id="score">Puntos: 0</div>
</div>
<p id="progress">Pregunta 1 de 16</p>
<div class="question"><h2 id="question"></h2></div>
<div id="options"></div>
<div class="feedback" id="feedback"></div>
<div class="footer"><button class="next" id="next" disabled>Siguiente</button></div>
</div>
</div>

<script>
const questions=[
["Pedido pequeño de fotocopias","El cliente necesita 10 fotocopias A4 en blanco y negro. Cada una cuesta $50. ¿Cuánto debe pagar?",["$250","$400","$500","$1.000"],2],
["Pedido pequeño de fotocopias","El cliente necesita 5 copias A4 en color. Cada una cuesta $150. ¿Cuál es el precio total?",["$250","$500","$750","$1.000"],2],
["Pedido pequeño de fotocopias","El cliente tiene $1.000 y realiza 12 fotocopias A4 en blanco y negro a $50 cada una. ¿Cuánto recibe de vuelto?",["$300","$400","$500","$600"],1],
["Pedido pequeño de fotocopias","¿Cuál de estos formatos es más grande?",["A4","A3","Ambos tienen el mismo tamaño","A5"],1],

["Impresión y encuadernación de un libro","Se imprimen 40 páginas A4 en blanco y negro a $70 cada una. ¿Cuánto cuesta la impresión?",["$1.400","$2.000","$2.800","$3.200"],2],
["Impresión y encuadernación de un libro","La impresión cuesta $2.800 y la encuadernación $800. ¿Cuál es el total?",["$2.800","$3.200","$3.600","$4.000"],2],
["Impresión y encuadernación de un libro","Antes de imprimir el libro, ¿qué debería verificar el empleado?",["Solo el nombre del cliente","Cantidad de páginas, formato y características de impresión","Solo el color de la tapa","El tamaño de la computadora"],1],
["Impresión y encuadernación de un libro","El cliente quiere que el libro quede unido y tenga una presentación organizada. ¿Qué servicio necesita?",["Plastificado","Fotocopiado","Encuadernación","Escaneado"],2],

["Pedido de folletos","Se necesitan 50 folletos a color a $250 cada uno. ¿Cuál es el precio?",["$5.000","$10.000","$12.500","$15.000"],2],
["Pedido de folletos","Los 50 folletos cuestan $12.500 y el diseño cuesta $1.000. ¿Cuál es el total?",["$12.500","$13.000","$13.500","$14.000"],2],
["Pedido de folletos","Antes de producir los 50 folletos, ¿qué sería recomendable hacer?",["Imprimir todos directamente","Realizar una muestra y confirmar el diseño con el cliente","Cambiar el formato sin consultar","Imprimir solamente uno y entregarlo"],1],
["Pedido de folletos","¿Qué información es importante confirmar antes de imprimir los folletos?",["Texto, imágenes, cantidad, formato y colores","Solo el nombre","Solo el precio","Solo el tamaño de hoja"],0],

["Pedido de una empresa","Una empresa necesita 30 folletos a color a $250 cada uno. ¿Cuánto cuestan?",["$5.000","$6.500","$7.500","$8.500"],2],
["Pedido de una empresa","Los 30 folletos cuestan $7.500 y el diseño $1.500. ¿Cuál es el total?",["$8.000","$8.500","$9.000","$9.500"],2],
["Pedido de una empresa","La empresa quiere incluir una foto del grupo de trabajo. ¿Qué debería solicitar el empleado?",["Una foto proporcionada por la empresa y verificar su calidad","Una hoja A3 vacía","Solo el nombre de la empresa","Una fotocopia en blanco y negro"],0],
["Pedido de una empresa","La empresa quiere agregar una pequeña dedicatoria. ¿Cuál es la mejor forma de trabajar?",["Escribir cualquier texto","Pedir el texto exacto y confirmar el diseño antes de imprimir","Eliminar la dedicatoria","Inventar el texto"],1]
];

let current=0,score=0,answered=false;
const qEl=document.getElementById("question"),optEl=document.getElementById("options");
const topicEl=document.getElementById("topic"),progressEl=document.getElementById("progress");
const scoreEl=document.getElementById("score"),feedbackEl=document.getElementById("feedback");
const nextBtn=document.getElementById("next");

function load(){
 answered=false;
 const q=questions[current];
 topicEl.textContent=q[0];
 progressEl.textContent=`Pregunta ${current+1} de ${questions.length}`;
 scoreEl.textContent=`Puntos: ${score}`;
 qEl.textContent=q[1];
 feedbackEl.textContent="";
 nextBtn.disabled=true;
 nextBtn.textContent=current===questions.length-1?"Ver resultado":"Siguiente";
 optEl.innerHTML="";
 q[2].forEach((text,index)=>{
   const b=document.createElement("button");
   b.className="option";
   b.textContent=String.fromCharCode(65+index)+") "+text;
   b.onclick=()=>answer(index,b);
   optEl.appendChild(b);
 });
}

function answer(index,clicked){
 if(answered)return;
 answered=true;
 const correct=questions[current][3];
 [...optEl.children].forEach((b,i)=>{
   b.disabled=true;
   if(i===correct)b.classList.add("correct");
 });
 if(index===correct){
   score++;
   clicked.classList.add("correct");
   feedbackEl.textContent="✓ ¡Correcto!";
 }else{
   clicked.classList.add("wrong");
   feedbackEl.textContent="✗ Incorrecto. La respuesta correcta está marcada en verde.";
 }
 scoreEl.textContent=`Puntos: ${score}`;
 nextBtn.disabled=false;
}

nextBtn.onclick=()=>{
 if(current<questions.length-1){
   current++;
   load();
 }else{
   showResult();
 }
};

function showResult(){
 let message;
 if(score>=13)message="¡Excelente! Tienes un muy buen manejo de las situaciones.";
 else if(score>=9)message="¡Muy bien! Comprendes la mayoría de las situaciones.";
 else if(score>=5)message="Bien. Conviene practicar algunos conceptos.";
 else message="Necesitas repasar precios, formatos y procedimientos.";
 document.getElementById("game").innerHTML=`
 <div class="result">
   <h1>Resultado final</h1>
   <h2>Obtuviste ${score} de ${questions.length} puntos.</h2>
   <p>${message}</p>
   <button class="restart" onclick="location.reload()">Jugar nuevamente</button>
 </div>`;
}
load();
</script>
</body>
</html>
